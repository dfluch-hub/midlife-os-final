name: LUNA final visual fixes

on:
  push:
    paths:
      - '.github/workflows/luna-finalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final LUNA visual fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
            ('.moonText{position:relative;z-index:2;text-shadow:0 1px 12px rgba(0,0,0,.75)}', '.moonText{position:relative;z-index:2;color:#0A0B10;font-weight:800;text-shadow:0 1px 2px rgba(255,255,255,.4)}'),
            ('.pre{font-size:11px;font-weight:750;max-width:80px;line-height:1.25}', '.pre{font-size:11px;font-weight:800;max-width:80px;line-height:1.25;color:#0A0B10;text-shadow:0 1px 2px rgba(255,255,255,.4)}'),
            ('.tab b{font-size:19px;font-weight:500}', '.tab b{font-size:19px;font-weight:500;margin-bottom:2px}'),
            ('.cryo{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffb071,#b83f2c 58%,#3d1718);box-shadow:0 0 70px rgba(255,107,74,.35);transition:background .8s,box-shadow .8s;touch-action:none}', '.cryo{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#ffb071,#b83f2c 58%,#3d1718);box-shadow:0 0 70px rgba(255,107,74,.35);transition:background .8s,box-shadow .8s;touch-action:none;user-select:none;-webkit-user-select:none}'),
            ('.bars{height:90px;display:flex;align-items:flex-end;gap:8px}', '.bars{height:110px;display:flex;align-items:flex-end;gap:8px;padding-top:8px}'),
            ('.barWrap{flex:1;text-align:center;color:var(--muted);font-size:8px}', '.barWrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;color:var(--muted);font-size:9px}'),
            ('.bar{width:100%;min-height:5px;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--gold),rgba(236,200,128,.25));margin-bottom:4px}', '.bar{width:100%;min-height:5px;border-radius:6px;background:linear-gradient(var(--gold),rgba(236,200,128,.25));margin-bottom:6px}')
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected CSS fragment: {old[:60]}')
            s = s.replace(old, new, 1)
          start = s.index('function renderReport(){')
          end = s.index("$('#pdfBtn').onclick", start)
          new_fn = "function renderReport(){let h=state.history||[],mrs=(state.signals||[]).length*3+(state.energy?5-state.energy:0);$('#mrsScore').textContent=mrs;let b=$('#bars');b.innerHTML='';let defaults=[65,80,45,90,75,60,85],days=['Mo','Di','Mi','Do','Fr','Sa','So'];let recent=h.slice(-7),offset=7-recent.length;let vals=defaults.map((fallback,i)=>({score:i>=offset?recent[i-offset].score:fallback}));vals.forEach((x,i)=>{let w=document.createElement('div');w.className='barWrap';w.innerHTML='<div class=\"bar\" style=\"height:'+Math.max(12,Math.min(90,x.score))+'%\"></div><span>'+days[i]+'</span>';b.append(w)})}\n"
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Finalize LUNA visual details'
          git push
