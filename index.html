<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE">
<title>Midlife OS</title>
<style>
:root{--bg:#F7F4EE;--card:#fff;--text:#223047;--muted:#6E7888;--line:#E4DED5;--sage:#A8B7A3;--sage2:#EDF2EC;--terra:#B86F61;--rose:#C9908B;--safe:env(safe-area-inset-bottom,0px);--nav:72px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}body{min-height:100dvh}button,input{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100dvh;background:#FBFAF7}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(251,250,247,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(34,48,71,.06)}.brand{font-weight:800;font-size:22px;letter-spacing:-.04em}.brand b{color:var(--terra)}.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text)}.screen{min-height:100dvh;padding:14px 14px calc(var(--nav) + var(--safe) + 34px)}.onboard{min-height:100dvh;padding:16px 16px calc(22px + var(--safe));display:flex;flex-direction:column;gap:14px}h1,h2,h3,p{margin:0}h1{font-size:30px;line-height:1.04;letter-spacing:-.04em}h2{font-size:20px}.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:800;color:var(--terra)}.sub{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.45}.stack{display:grid;gap:12px}.card{padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 28px rgba(46,54,70,.07)}.primary,.secondary{width:100%;min-height:50px;border-radius:15px;font-weight:800;font-size:15px}.primary{border:0;background:var(--text);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--text)}.textbtn{min-height:44px;border:0;background:transparent;color:var(--muted);font-weight:750}.hero{min-height:370px;padding:18px;border-radius:26px;display:flex;align-items:flex-end;position:relative;overflow:hidden;background:linear-gradient(145deg,#EEE7DD,#E7E2DA 55%,#DFE6DF);border:1px solid #DDD7CE}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 55% 33%,rgba(205,159,142,.72) 0 8%,transparent 9%),radial-gradient(ellipse at 55% 48%,rgba(82,68,73,.62) 0 19%,transparent 20%),radial-gradient(ellipse at 52% 64%,rgba(120,92,99,.34) 0 28%,transparent 29%)}.heroin{position:relative;z-index:2;display:grid;gap:10px}.hero h1{font-size:35px}.value{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.value div{padding:8px 5px;border-radius:12px;background:rgba(255,255,255,.76);text-align:center;font-size:10px;color:var(--muted)}.value b{display:block;color:var(--text);font-size:11px;margin-top:2px}.progress{height:4px;background:#E9E5DD;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--terra),var(--rose))}.symgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sym{min-height:86px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--text);text-align:left;position:relative}.sym .ico{font-size:21px;display:block;margin-bottom:10px}.sym strong{font-size:13px}.sym .badge{position:absolute;top:9px;right:9px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#F1EEE8;display:grid;place-items:center;font-size:10px;color:var(--muted)}.sym.active{background:var(--sage2);border-color:#CBD8C8}.sym.active .badge{background:var(--sage);color:#fff}.note{padding:10px 12px;border-radius:14px;background:#F3EFE8;color:var(--muted);font-size:12px;line-height:1.4}.statuslist{display:grid;gap:8px}.status{min-height:64px;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--text);display:grid;grid-template-columns:38px 1fr 18px;gap:10px;align-items:center;text-align:left}.status .ico{width:38px;height:38px;border-radius:12px;background:#F3F0EA;display:grid;place-items:center}.status strong{display:block;font-size:13px}.status small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.status.active{background:#FAF3F1;border-color:#D3C1BA}.privacy{display:grid;gap:12px;text-align:center}.lock{width:76px;height:76px;border-radius:50%;margin:auto;display:grid;place-items:center;background:var(--sage2);font-size:30px}.info{display:flex;gap:9px;text-align:left;padding:7px 0;color:var(--muted);font-size:13px;line-height:1.35}.info b{color:var(--sage)}.headrow,.checkhead,.rowtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{padding:7px 10px;border-radius:999px;background:#F1EEE8;color:var(--muted);font-size:11px}.row{padding:10px 0;border-bottom:1px solid #EFEAE2}.row:last-child{border-bottom:0}.name{font-size:13px;font-weight:760}.level{font-size:12px;color:var(--terra);font-weight:760}.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.scale button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#FAF8F4;color:var(--muted);font-size:11px;font-weight:720}.scale button.active{background:var(--sage2);border-color:#CBD8C8;color:var(--text)}.feedback{padding:12px 13px;border-radius:16px;background:#F7EEE9;border:1px solid #ECD7CF;font-size:12px;line-height:1.4}.empty{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:9px}.empty .ico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--sage2);font-size:22px}.empty p{max-width:30ch;color:var(--muted);font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#EEEAE4;border-radius:14px}.tabs button{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:12px;font-weight:740}.tabs button.active{background:#fff;color:var(--text)}.chart{height:145px;margin-top:10px;border-radius:14px;background:linear-gradient(#F1EEE8 1px,transparent 1px),linear-gradient(90deg,#F1EEE8 1px,transparent 1px);background-size:32px 32px;overflow:hidden}.chart svg{width:100%;height:100%}.sl{fill:none;stroke:#7E9A89;stroke-width:3}.hl{fill:none;stroke:var(--terra);stroke-width:3}.insight{min-height:58px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--text);display:grid;grid-template-columns:1fr auto;text-align:left}.insight strong{font-size:13px}.insight small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{padding:10px;min-height:74px}.metric strong{display:block;font-size:16px;margin-top:5px}.metric span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.sectiontitle{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:2px 2px 6px}.setting{min-height:58px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--text);display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left}.setting .ico{width:36px;height:36px;border-radius:11px;background:#F3F0EA;display:grid;place-items:center}.setting strong{display:block;font-size:13px}.setting small{display:block;color:var(--muted);font-size:10px;line-height:1.3;margin-top:2px}.lang{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#EEEAE4;border-radius:13px}.lang button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:760}.lang button.active{background:#fff;color:var(--text)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:40;width:min(480px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(6px + var(--safe));min-height:calc(var(--nav) + var(--safe));background:rgba(251,250,247,.97);backdrop-filter:blur(18px);border-top:1px solid rgba(34,48,71,.08)}.nav button{min-height:52px;border:0;border-radius:12px;background:transparent;color:#88909C;display:grid;place-items:center;gap:1px;font-size:10px;font-weight:730}.nav button b{font-size:18px}.nav button.active{background:var(--sage2);color:var(--text)}.modal{position:fixed;inset:0;z-index:80;background:rgba(34,48,71,.22);backdrop-filter:blur(5px);display:grid;place-items:end center;padding:10px}.sheet{width:min(100%,480px);max-height:84dvh;overflow:auto;padding:15px;border-radius:22px 22px 14px 14px;background:#FBFAF7;border:1px solid var(--line)}.sheethead{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.close{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text)}.toast{position:fixed;z-index:100;left:50%;bottom:calc(var(--nav) + var(--safe) + 14px);transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:var(--text);color:#fff;font-size:12px;white-space:nowrap}@media print{.top,.nav,.no-print{display:none!important}.screen{padding:0}.app{max-width:none}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{"use strict";
const K="midlifeOS_v7",L=["none","light","medium","strong"];
const T={de:{today:"Heute",patterns:"Muster",doctor:"Arzt",me:"Ich",start:"Jetzt starten",welcome:"Weniger eintragen. Mehr verstehen.",welcomeSub:"Midlife OS hilft dir, Symptome festzuhalten, Muster zu erkennen und dein nächstes Arztgespräch entspannt vorzubereiten.",choose:"Was belastet dich gerade am meisten?",chooseSub:"Wir empfehlen 3 Fokus-Symptome, damit dein täglicher Check kurz bleibt. Weitere Symptome kannst du trotzdem speichern.",cycle:"Wie verhält sich dein Zyklus?",privacy:"Deine Gesundheit. Deine Daten.",open:"Midlife OS öffnen",next:"Weiter",check:"Kurz-Check",save:"Eintrag speichern",none:"Keine",light:"Leicht",medium:"Mittel",strong:"Stark",patternsTitle:"Was fällt auf?",emptyPatterns:"Noch keine Muster sichtbar",emptyPatternsSub:"Trage an 3 Tagen deine Werte ein, um hier erste einfache Zusammenhänge zu sehen.",doctorTitle:"Gut vorbereitet ins Gespräch",emptyReport:"Noch kein Bericht möglich",emptyReportSub:"Nach mindestens 3 Tagen kann Midlife OS einen ersten strukturierten Überblick erstellen.",meTitle:"Mein Midlife OS",therapy:"Meine Therapie & Medikamente",knowledge:"Wissen & Orientierung",settings:"Sprache & App-Einstellungen",advanced:"Erweiterte Einstellungen & Datensicherheit",hrt:"Hormonersatztherapie (HRT)",hrtSub:"z. B. Östrogen-Pflaster oder Progesteron. Hier kannst du Einnahmen und Änderungen dokumentieren.",report:"Arzt-Bericht als PDF",edit:"Ändern"},en:{today:"Today",patterns:"Patterns",doctor:"Doctor",me:"Me",start:"Get started",welcome:"Track less. Understand more.",welcomeSub:"Midlife OS helps you capture symptoms, understand patterns and prepare for your next doctor visit with less stress.",choose:"What is affecting you most right now?",chooseSub:"We recommend 3 focus symptoms to keep your daily check-in short. You can still save additional symptoms.",cycle:"How has your cycle been lately?",privacy:"Your health. Your data.",open:"Open Midlife OS",next:"Continue",check:"Quick check-in",save:"Save entry",none:"None",light:"Mild",medium:"Moderate",strong:"Strong",patternsTitle:"What stands out?",emptyPatterns:"No patterns yet",emptyPatternsSub:"Check in on 3 days to start seeing simple trends here.",doctorTitle:"Prepare for your appointment",emptyReport:"Report not ready yet",emptyReportSub:"After at least 3 days, Midlife OS can create a first structured summary.",meTitle:"My Midlife OS",therapy:"My therapy & medications",knowledge:"Knowledge & guidance",settings:"Language & app settings",advanced:"Advanced settings & data security",hrt:"Hormone replacement therapy (HRT)",hrtSub:"e.g. an estrogen patch or progesterone. Track medication and changes here.",report:"Doctor report as PDF",edit:"Edit"}};
const S=[["hot","🔥","Hitzewallungen","Hot flashes"],["brain","🧠","Brain Fog","Brain fog"],["sleep","☾","Schlafstörungen","Sleep problems"],["restless","♡","Innere Unruhe","Restlessness / anxiety"],["joints","⌁","Gelenkschmerzen","Joint pain"],["fatigue","ϟ","Erschöpfung","Fatigue"]],C=[["regular","▣","Regelmäßig","Regular"],["changing","≈","Unregelmäßig / verändert","Irregular / changing"],["stopped","Ⅱ","Seit über 12 Monaten ausgeblieben","No period for over 12 months"],["hormonal","◒","Hormone / OP","Hormonal treatment / surgery"]];
const D={lang:"de",onboarded:false,step:1,focus:["hot","sleep","fatigue"],other:[],status:"changing",entries:{},range:7};let st=load(),view="today",modal=null;
function load(){try{return {...D,...JSON.parse(localStorage.getItem(K)||"{}")}}catch(e){return {...D}}}function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}function t(k){return T[st.lang][k]||k}function sn(id){const s=S.find(x=>x[0]===id);return s?(st.lang==="de"?s[2]:s[3]):""}function es(){return Object.values(st.entries||{}).filter(e=>e&&e.date).sort((a,b)=>a.date.localeCompare(b.date))}function iso(){return new Date().toISOString().slice(0,10)}function te(){const o=st.entries[iso()]||{},v={};st.focus.forEach(id=>v[id]=o.values?.[id]||"none");return {date:iso(),values:v}}function toast(m){const x=document.createElement("div");x.className="toast";x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function render(){const a=document.getElementById("app");if(!st.onboarded){a.innerHTML=onboarding();bindOn();return}a.innerHTML=`<div class="app"><header class="top"><div class="brand">Midlife <b>OS.</b></div><button class="iconbtn" id="gear">⚙</button></header>${screen()}${nav()}${modal?modalHtml():""}</div>`;bindCommon();bindScreen();bindModal()}
function onboarding(){if(st.step===1)return `<div class="app"><main class="onboard"><div class="brand">Midlife <b>OS.</b></div><section class="hero"><div class="heroin"><div class="kicker">Perimenopause & Menopause</div><h1>${t("welcome")}</h1><p class="sub">${t("welcomeSub")}</p><button class="primary" id="start">${t("start")}</button><div class="value"><div>1<b>${st.lang==="de"?"Eintragen":"Track"}</b></div><div>2<b>${st.lang==="de"?"Verstehen":"Understand"}</b></div><div>3<b>${st.lang==="de"?"Vorbereiten":"Prepare"}</b></div></div></div></section></main></div>`;if(st.step===2)return `<div class="app"><main class="onboard"><div class="brand">Midlife <b>OS.</b></div><div class="progress"><span style="width:33%"></span></div><div><div class="kicker">1 / 3</div><h1 style="margin-top:5px">${t("choose")}</h1><p class="sub">${t("chooseSub")}</p></div><div class="symgrid">${S.map(s=>`<button class="sym ${st.focus.includes(s[0])?"active":""}" data-sym="${s[0]}"><span class="badge">${st.focus.includes(s[0])?"✓":"+"}</span><span class="ico">${s[1]}</span><strong>${st.lang==="de"?s[2]:s[3]}</strong></button>`).join("")}</div><div class="note">${st.lang==="de"?`Empfohlen: 3 Fokus-Symptome · aktuell ${st.focus.length}`:`Recommended: 3 focus symptoms · currently ${st.focus.length}`}</div><div style="margin-top:auto"><button class="primary" id="next">${t("next")}</button></div></main></div>`;if(st.step===3)return `<div class="app"><main class="onboard"><div class="brand">Midlife <b>OS.</b></div><div class="progress"><span style="width:66%"></span></div><div><div class="kicker">2 / 3</div><h1 style="margin-top:5px">${t("cycle")}</h1></div><div class="statuslist">${C.map(c=>`<button class="status ${st.status===c[0]?"active":""}" data-status="${c[0]}"><span class="ico">${c[1]}</span><span><strong>${st.lang==="de"?c[2]:c[3]}</strong></span><span>›</span></button>`).join("")}</div><div style="margin-top:auto"><button class="primary" id="next">${t("next")}</button></div></main></div>`;return `<div class="app"><main class="onboard"><div class="brand">Midlife <b>OS.</b></div><div class="progress"><span style="width:100%"></span></div><section class="card privacy"><div class="lock">🔒</div><h1>${t("privacy")}</h1><p class="sub">${st.lang==="de"?"Deine Einträge bleiben lokal auf diesem Gerät.":"Your entries stay locally on this device."}</p><div><div class="info"><b>●</b><span>${st.lang==="de"?"Kein Konto und keine Anmeldung nötig.":"No account or sign-in required."}</span></div><div class="info"><b>●</b><span>${st.lang==="de"?"Du entscheidest über Backup und Arzt-Bericht.":"You decide about backups and doctor reports."}</span></div></div></section><div style="margin-top:auto"><button class="primary" id="open">${t("open")}</button></div></main></div>`}
function nav(){return `<nav class="nav">${[["today","⌂",t("today")],["patterns","▥",t("patterns")],["doctor","✚",t("doctor")],["me","○",t("me")]].map(x=>`<button class="${view===x[0]?"active":""}" data-view="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join("")}</nav>`}function screen(){return view==="patterns"?patterns():view==="doctor"?doctor():view==="me"?me():today()}
function today(){const e=te(),cnt=es().length,rem=Math.max(0,3-cnt);return `<main class="screen"><div class="stack"><div class="headrow"><div><div class="kicker">${t("today")}</div><h1 style="margin-top:4px">${st.lang==="de"?"Dein Tag":"Your day"}</h1></div><div class="pill">${new Date().toLocaleDateString(st.lang==="de"?"de-DE":"en-GB",{day:"2-digit",month:"short"})}</div></div><section class="card"><div class="checkhead"><div><h2>${t("check")}</h2><p class="sub">${st.lang==="de"?"Nur deine wichtigsten Symptome":"Only your most important symptoms"}</p></div><button class="textbtn" id="edit">${t("edit")}</button></div>${st.focus.map(id=>{const v=e.values[id]||"none";return `<div class="row"><div class="rowtop"><div class="name">${sn(id)}</div><div class="level">${t(v)}</div></div><div class="scale">${L.map(l=>`<button class="${v===l?"active":""}" data-level="${id}:${l}">${t(l)}</button>`).join("")}</div></div>`}).join("")}</section><section class="card" style="background:var(--sage2)"><div class="headrow"><strong style="font-size:13px">${rem>0?(st.lang==="de"?`Noch ${rem} ${rem===1?"Eintrag":"Einträge"} bis zum ersten Arzt-Bericht`:`${rem} more ${rem===1?"entry":"entries"} until your first doctor report`):(st.lang==="de"?"Dein erster Arzt-Bericht ist bereit":"Your first doctor report is ready")}</strong><span class="pill">${Math.min(cnt,3)}/3</span></div></section><div id="fb"></div><button class="primary" id="save">${t("save")}</button></div></main>`}
function patterns(){const a=es();if(a.length<3)return `<main class="screen"><div class="stack"><div><div class="kicker">${t("patterns")}</div><h1>${t("patternsTitle")}</h1></div><section class="card empty"><div class="ico">⌁</div><h2>${t("emptyPatterns")}</h2><p>${t("emptyPatternsSub")}</p><div class="pill">${a.length}/3</div></section></div></main>`;const d=a.slice(-Math.min(st.range,a.length)),p=d.map((e,i)=>({x:18+i*(300/Math.max(1,d.length-1)),s:110-L.indexOf(e.values?.sleep||"none")*28,h:110-L.indexOf(e.values?.hot||"none")*28}));return `<main class="screen"><div class="stack"><div><div class="kicker">${t("patterns")}</div><h1>${t("patternsTitle")}</h1></div><div class="tabs">${[7,30,90].map(n=>`<button class="${st.range===n?"active":""}" data-range="${n}">${n} ${st.lang==="de"?"Tage":"days"}</button>`).join("")}</div><section class="card"><h2>${st.lang==="de"?"Schlaf & Hitzewallungen":"Sleep & hot flashes"}</h2><div class="chart"><svg viewBox="0 0 340 140" preserveAspectRatio="none"><polyline class="sl" points="${p.map(x=>`${x.x},${x.s}`).join(" ")}"/><polyline class="hl" points="${p.map(x=>`${x.x},${x.h}`).join(" ")}"/></svg></div></section><button class="insight" id="ins"><span><strong>${st.lang==="de"?"Erste Beobachtung":"First observation"}</strong><small>${st.lang==="de"?"Tippe für eine kurze Erklärung":"Tap for a short explanation"}</small></span><span>›</span></button></div></main>`}
function doctor(){const a=es();if(a.length<3)return `<main class="screen"><div class="stack"><div><div class="kicker">${t("doctor")}</div><h1>${t("doctorTitle")}</h1></div><section class="card empty"><div class="ico">✚</div><h2>${t("emptyReport")}</h2><p>${t("emptyReportSub")}</p><div class="pill">${a.length}/3</div></section></div></main>`;const last=a[a.length-1];return `<main class="screen"><div class="stack"><div><div class="kicker">${t("doctor")}</div><h1>${t("doctorTitle")}</h1></div><div class="metrics">${st.focus.slice(0,3).map(id=>`<section class="card metric"><div>${S.find(x=>x[0]===id)?.[1]||"•"}</div><strong>${t(last.values?.[id]||"none")}</strong><span>${sn(id)}</span></section>`).join("")}</div><section class="card"><h2>${st.lang==="de"?"Überblick":"Overview"}</h2><p class="sub">${st.lang==="de"?`${a.length} Einträge · Fokus: ${st.focus.map(sn).join(", ")}`:`${a.length} entries · Focus: ${st.focus.map(sn).join(", ")}`}</p></section><button class="primary no-print" id="pdf">${t("report")}</button><p class="sub" style="font-size:11px">${st.lang==="de"?"Midlife OS ersetzt keine ärztliche Beratung.":"Midlife OS does not replace medical advice."}</p></div></main>`}
function me(){return `<main class="screen"><div class="stack"><div><div class="kicker">${t("me")}</div><h1>${t("meTitle")}</h1></div><div class="sectiontitle">${t("therapy")}</div><button class="setting" id="therapy"><span class="ico">✚</span><span><strong>${t("hrt")}</strong><small>${t("hrtSub")}</small></span><span>›</span></button><div class="sectiontitle">${t("knowledge")}</div><button class="setting" id="know"><span class="ico">▤</span><span><strong>${t("knowledge")}</strong><small>${st.lang==="de"?"Kurze, verständliche Fachinfos":"Short, clear health information"}</small></span><span>›</span></button><div class="sectiontitle">${t("settings")}</div><section class="card"><div class="lang"><button class="${st.lang==="de"?"active":""}" data-lang="de">Deutsch</button><button class="${st.lang==="en"?"active":""}" data-lang="en">English</button></div></section><button class="setting" id="advanced"><span class="ico">⚙</span><span><strong>${t("advanced")}</strong><small>${st.lang==="de"?"Backup und Wiederherstellung":"Backup and restore"}</small></span><span>›</span></button></div></main>`}
function modalHtml(){if(modal==="focus")return `<div class="modal"><section class="sheet"><div class="sheethead"><h2>${t("choose")}</h2><button class="close" data-close>×</button></div><div class="note">${t("chooseSub")}</div><div class="symgrid" style="margin-top:10px">${S.map(s=>`<button class="sym ${st.focus.includes(s[0])?"active":""}" data-ms="${s[0]}"><span class="badge">${st.focus.includes(s[0])?"✓":"+"}</span><span class="ico">${s[1]}</span><strong>${st.lang==="de"?s[2]:s[3]}</strong></button>`).join("")}</div></section></div>`;if(modal==="ins")return `<div class="modal"><section class="sheet"><div class="sheethead"><h2>${st.lang==="de"?"Was bedeutet das?":"What does this mean?"}</h2><button class="close" data-close>×</button></div><p class="sub">${st.lang==="de"?"Midlife OS zeigt nur Zusammenhänge in deinen Einträgen. Das beweist keine Ursache.":"Midlife OS only shows associations in your entries. This does not prove causation."}</p></section></div>`;if(modal==="know")return `<div class="modal"><section class="sheet"><div class="sheethead"><h2>${t("knowledge")}</h2><button class="close" data-close>×</button></div><div class="stack"><section class="card"><h3>Perimenopause</h3><p class="sub">${st.lang==="de"?"Kurze, verständliche Orientierung ohne Alarmismus.":"Short, clear guidance without alarmism."}</p></section><section class="card"><h3>${t("hrt")}</h3><p class="sub">${t("hrtSub")}</p></section></div></section></div>`;if(modal==="advanced")return `<div class="modal"><section class="sheet"><div class="sheethead"><h2>${t("advanced")}</h2><button class="close" data-close>×</button></div><div class="stack"><button class="secondary" id="backup">${st.lang==="de"?"Backup erstellen":"Create backup"}</button><label class="secondary" style="display:grid;place-items:center"><span>${st.lang==="de"?"Backup wiederherstellen":"Restore backup"}</span><input type="file" id="restore" accept="application/json" hidden></label></div></section></div>`;return ""}
function toggle(id){if(st.focus.includes(id))st.focus=st.focus.filter(x=>x!==id);else if(st.focus.length<3)st.focus.push(id);else{st.other=Array.from(new Set([...(st.other||[]),id]));toast(st.lang==="de"?"Als weiteres Symptom gespeichert.":"Saved as an additional symptom.")}save();render()}
function bindOn(){document.getElementById("start")?.addEventListener("click",()=>{st.step=2;save();render()});document.querySelectorAll("[data-sym]").forEach(b=>b.addEventListener("click",()=>toggle(b.dataset.sym)));document.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click",()=>{st.status=b.dataset.status;save();render()}));document.getElementById("next")?.addEventListener("click",()=>{if(!st.focus.length){toast(st.lang==="de"?"Bitte mindestens 1 Symptom wählen.":"Please choose at least 1 symptom.");return}st.step=Math.min(4,st.step+1);save();render()});document.getElementById("open")?.addEventListener("click",()=>{st.onboarded=true;save();render()})}
function bindCommon(){document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;modal=null;render();window.scrollTo(0,0)}));document.getElementById("gear")?.addEventListener("click",()=>{view="me";render()})}
function bindScreen(){if(view==="today"){const e=te();document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{const [id,l]=b.dataset.level.split(":");e.values[id]=l;st.entries[e.date]=e;save();render()}));document.getElementById("save")?.addEventListener("click",()=>{st.entries[e.date]=e;save();const q=Object.entries(e.values).sort((a,b)=>L.indexOf(b[1])-L.indexOf(a[1]))[0],fb=document.getElementById("fb");if(fb&&q&&L.indexOf(q[1])>=2)fb.innerHTML=`<div class="feedback">${st.lang==="de"?`Danke fürs Eintragen. ${sn(q[0])} ist heute ${t(q[1]).toLowerCase()}. Wenn du magst, gönn dir kurz Ruhe.`:`Thanks for checking in. ${sn(q[0])} is ${t(q[1]).toLowerCase()} today. If you like, take a short pause.`}</div>`;else toast(st.lang==="de"?"Eintrag gespeichert.":"Entry saved.")});document.getElementById("edit")?.addEventListener("click",()=>{modal="focus";render()})}if(view==="patterns"){document.querySelectorAll("[data-range]").forEach(b=>b.addEventListener("click",()=>{st.range=Number(b.dataset.range);save();render()}));document.getElementById("ins")?.addEventListener("click",()=>{modal="ins";render()})}if(view==="doctor")document.getElementById("pdf")?.addEventListener("click",()=>window.print());if(view==="me"){document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{st.lang=b.dataset.lang;save();render()}));document.getElementById("know")?.addEventListener("click",()=>{modal="know";render()});document.getElementById("advanced")?.addEventListener("click",()=>{modal="advanced";render()});document.getElementById("therapy")?.addEventListener("click",()=>toast(st.lang==="de"?"Therapie-Tracker folgt als nächster Ausbau.":"Therapy tracking is the next expansion."))}}
function bindModal(){document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>{modal=null;render()}));document.querySelectorAll("[data-ms]").forEach(b=>b.addEventListener("click",()=>toggle(b.dataset.ms)));document.getElementById("backup")?.addEventListener("click",()=>{const blob=new Blob([JSON.stringify(st,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`midlife-os-backup-${iso()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});document.getElementById("restore")?.addEventListener("change",ev=>{const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{st={...D,...JSON.parse(r.result)};save();render()}catch(e){alert(st.lang==="de"?"Backup konnte nicht gelesen werden.":"Backup could not be read.")}};r.readAsText(f)})}
render()})();
</script></body></html>
