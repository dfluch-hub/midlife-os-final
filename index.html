let state=load(),modal=null,toastTimer=null;const root=document.getElementById("root"),T=k=>TXT[state.language]?.[k]??k;
function uid(){return crypto.randomUUID?crypto.randomUUID():"e_"+Date.now()+Math.random().toString(36).slice(2)}

function pearson(xs,ys){if(xs.length!==ys.length||xs.length<4)return NaN;const mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;let n=0,dx=0,dy=0;for(let i=0;i<xs.length;i++){const a=xs[i]-mx,b=ys[i]-my;n+=a*b;dx+=a*a;dy+=b*b}const d=Math.sqrt(dx*dy);return d?n/d:NaN}
function correlations(entries){const defs=[{a:entries.map(e=>5-e.sleep),b:entries.map(e=>e.fog?1:0),txt:state.language==="de"?"Unruhiger Schlaf tritt häufiger mit Brain Fog auf.":"Restless sleep appears more often with brain fog."},{a:entries.map(e=>5-e.energy),b:entries.map(e=>e.restless?1:0),txt:state.language==="de"?"Niedrigere Energie tritt häufiger mit Unruhe auf.":"Lower energy appears more often with restlessness."},{a:entries.map(e=>5-e.sleep),b:entries.map(e=>e.heat?1:0),txt:state.language==="de"?"Schlechterer Schlaf tritt häufiger mit Hitze-Signalen auf.":"Poorer sleep appears more often with heat signals."}];return defs.map(d=>({r:pearson(d.a,d.b),txt:d.txt})).filter(x=>Number.isFinite(x.r)&&x.r>=.25).sort((a,b)=>b.r-a.r).slice(0,3)}
function chart(entries){if(entries.length<2)return `<div class="empty">${T("insufficient")}</div>`;const w=700,h=180,p=24;const pts=entries.map((e,i)=>({x:p+i*((w-2*p)/Math.max(1,entries.length-1)),y:p+(100-score(e))*((h-2*p)/80)}));const line=pts.map((q,i)=>`${i?"L":"M"} ${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(" "),area=`${line} L ${pts.at(-1).x} ${h-p} L ${pts[0].x} ${h-p} Z`;return `<svg class="chart" viewBox="0 0 ${w} ${h}"><path class="chart-grid" d="M${p} ${p} H${w-p}"/><path class="chart-grid" d="M${p} ${h/2} H${w-p}"/><path class="chart-grid" d="M${p} ${h-p} H${w-p}"/><path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>${pts.map(q=>`<circle class="chart-dot" cx="${q.x}" cy="${q.y}" r="4"/>`).join("")}</svg>`}
function trendsView(){const es=entriesWithin(state.trendRange),cs=correlations(es);return `<section class="page-head"><span class="eyebrow">${T("trends")}</span><h1>${T("trendTitle")}</h1><p>${T("trendSub")}</p></section><div class="filters"><button class="filter ${state.trendRange===7?"active":""}" data-tr="7">${T("seven")}</button><button class="filter ${state.trendRange===30?"active":""}" data-tr="30">${T("thirty")}</button></div><section class="grid"><div class="metrics"><div class="metric"><small>${T("avgBalance")}</small><strong>${es.length?Math.round(avg(es,score))+"%":"–"}</strong></div><div class="metric"><small>${T("avgEnergy")}</small><strong>${avg(es,e=>e.energy)??"–"}</strong></div><div class="metric"><small>${T("avgSleep")}</small><strong>${avg(es,e=>e.sleep)??"–"}</strong></div></div><article class="card">${chart(es)}</article><article class="card"><strong style="font-size:13px">${T("correlations")}</strong><div style="margin-top:12px">${es.length<4?`<div class="empty">${T("insufficient")}</div>`:cs.length?cs.map(c=>`<div class="insight"><div class="insight-icon">↗</div><p>${c.txt}</p></div>`).join(""):`<div class="insight"><div class="insight-icon">✦</div><p>${T("insufficient")}</p></div>`}</div></article></section>`}
function doctorStats(es){const counts={heat:0,heart:0,fog:0,restless:0};es.forEach(e=>Object.keys(counts).forEach(k=>{if(e[k])counts[k]++}));const labels={heat:T("heat"),heart:T("heart"),fog:T("fog"),restless:T("restless")};return Object.entries(counts).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${labels[k]} (${v}/${es.length})`).join(" · ")||"–"}
function doctorText(){const es=entriesWithin(state.doctorRange);return state.language==="de"?["MIDLIFE OS – ARZT-ZUSAMMENFASSUNG","",`Zeitraum: letzte ${state.doctorRange} Tage`,`Erfasste Tage: ${es.length}`,`Ø Tages-Balance: ${es.length?Math.round(avg(es,score))+"%":"–"}`,`Häufigste Signale: ${doctorStats(es)}`,"",`Fragen / Themen: ${state.doctorQuestions.trim()||"–"}`,"",T("medical")].join("\n"):["MIDLIFE OS – APPOINTMENT SUMMARY","",`Period: last ${state.doctorRange} days`,`Tracked days: ${es.length}`,`Average daily balance: ${es.length?Math.round(avg(es,score))+"%":"–"}`,`Most frequent signals: ${doctorStats(es)}`,"",`Questions / topics: ${state.doctorQuestions.trim()||"–"}`,"",T("medical")].join("\n")}
function doctorView(){const es=entriesWithin(state.doctorRange);return `<section class="page-head"><span class="eyebrow">${T("doctor")}</span><h1>${T("doctorTitle")}</h1><p>${T("doctorSub")}</p></section><div class="filters"><button class="filter ${state.doctorRange===30?"active":""}" data-dr="30">${T("last30")}</button><button class="filter ${state.doctorRange===90?"active":""}" data-dr="90">${T("last90")}</button></div><section class="grid"><article class="card"><div class="summary-row"><span>${T("tracked")}</span><strong>${es.length}</strong></div><div class="summary-row"><span>${T("avgBalance")}</span><strong>${es.length?Math.round(avg(es,score))+"%":"–"}</strong></div><div class="summary-row"><span>${T("common")}</span><strong>${doctorStats(es)}</strong></div></article><article class="card"><strong style="font-size:12px">${T("questions")}</strong><textarea id="doctorQuestions" placeholder="${T("questionsPh")}" style="margin-top:9px">${esc(state.doctorQuestions)}</textarea></article><button class="primary" id="openSummary">${T("summary")}</button><button class="secondary" id="printDoctor">${T("print")}</button><p class="small">${T("medical")}</p></section>`}
function settingsView(){return `<section class="page-head"><span class="eyebrow">${T("data")}</span><h1>${T("dataTitle")}</h1><p>${T("dataSub")}</p></section><section class="grid"><article class="card"><strong style="font-size:13px">${T("privacy")}</strong><p class="small">${T("privacyText")}</p></article><article class="card"><div class="setting-row"><div><strong>${T("appearance")}</strong></div><select class="select" id="themeSelect"><option value="system" ${state.theme==="system"?"selected":""}>${T("system")}</option><option value="light" ${state.theme==="light"?"selected":""}>${T("light")}</option><option value="dark" ${state.theme==="dark"?"selected":""}>${T("dark")}</option></select></div></article><button class="secondary" id="exportJson">${T("exportJson")}</button><button class="secondary" id="importJsonBtn">${T("importJson")}</button><button class="secondary" id="exportCsv">${T("exportCsv")}</button><button class="danger" id="deleteAll">${T("deleteAll")}</button><input class="file" type="file" id="importFile" accept=".json,application/json"><p class="small">${T("medical")}</p></section>`}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){applyTheme();const view=state.route==="today"?todayView():state.route==="trends"?trendsView():state.route==="doctor"?doctorView():settingsView();root.innerHTML=`<div class="app">${header()}<main>${view}</main></div>${tabbar()}<div id="modalRoot"></div>`;bind();renderModal()}
function bind(){document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{state.language=b.dataset.lang;persist();render()});document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{state.route=b.dataset.route;persist();location.hash=state.route;render()});document.getElementById("themeBtn")?.addEventListener("click",()=>{state.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";persist();render()});document.getElementById("openCheckin")?.addEventListener("click",()=>openCheckin());document.getElementById("openSos")?.addEventListener("click",()=>openSos());document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{state.trendRange=Number(b.dataset.tr);persist();render()});document.querySelectorAll("[data-dr]").forEach(b=>b.onclick=()=>{state.doctorRange=Number(b.dataset.dr);persist();render()});document.getElementById("doctorQuestions")?.addEventListener("input",e=>{state.doctorQuestions=e.target.value;persist()});document.getElementById("openSummary")?.addEventListener("click",()=>{modal={type:"summary",text:doctorText()};renderModal()});document.getElementById("printDoctor")?.addEventListener("click",()=>window.print());document.getElementById("themeSelect")?.addEventListener("change",e=>{state.theme=e.target.value;persist();render()});document.getElementById("exportJson")?.addEventListener("click",exportJson);document.getElementById("exportCsv")?.addEventListener("click",exportCsv);document.getElementById("importJsonBtn")?.addEventListener("click",()=>document.getElementById("importFile")?.click());document.getElementById("importFile")?.addEventListener("change",importJson);document.getElementById("deleteAll")?.addEventListener("click",()=>{modal={type:"delete"};renderModal()})}
function openCheckin(){const e=todayEntry();modal={type:"checkin",draft:e?{...e}:{id:"",date:new Date().toISOString(),energy:3,sleep:2,heat:false,heart:false,fog:false,restless:false,cycle:"none",acute:[]}};renderModal()}
function openSos(){modal={type:"sos",choice:null};renderModal()}
function renderModal(){const r=document.getElementById("modalRoot");if(!r)return;if(!modal){r.innerHTML="";return}if(modal.type==="checkin"){const d=modal.draft;r.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="sheet"><div class="grab"></div><header class="sheet-head"><div><span class="eyebrow">${state.language==="de"?"TAGES-CHECK-IN":"DAILY CHECK-IN"}</span><h2>${state.language==="de"?"Kurz antippen. Fertig.":"Tap quickly. Done."}</h2></div><button class="close" id="closeModal">×</button></header><div class="compact-check"><div class="check-row"><label>${T("energy")}</label><div class="chips5">${[1,2,3,4,5].map(v=>`<button class="chip ${d.energy===v?"active":""}" data-energy="${v}">${v}</button>`).join("")}</div></div><div class="check-row"><label>${T("sleep")}</label><div class="chips4">${[[1,T("sleepRestless")],[2,T("sleepMixed")],[3,T("sleepGood")],[4,T("sleepDeep")]].map(([v,l])=>`<button class="chip ${d.sleep===v?"active":""}" data-sleep="${v}">${l}</button>`).join("")}</div></div><div class="check-row"><label>${T("signals")}</label><div class="signal-grid">${[["heat",T("heat")],["heart",T("heart")],["fog",T("fog")],["restless",T("restless")]].map(([k,l])=>`<button class="signal-chip ${d[k]?"active":""}" data-signal="${k}">${l}</button>`).join("")}</div></div><div class="check-row"><label>${T("cycle")}</label><div class="chips4">${[["none",T("cycleNone")],["spot",T("cycleSpot")],["light",T("cycleLight")],["heavy",T("cycleHeavy")]].map(([v,l])=>`<button class="chip ${d.cycle===v?"active":""}" data-cycle="${v}">${l}</button>`).join("")}</div></div><button class="primary" id="saveCheckin">${T("finish")}</button></div></section></div>`}else if(modal.type==="sos"){r.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="sheet"><div class="grab"></div><header class="sheet-head"><div><span class="eyebrow">SOS</span><h2>${T("sos")}</h2></div><button class="close" id="closeModal">×</button></header><div class="signal-grid">${[["heat",T("heat")],["heart",T("heart")],["fog",T("fog")],["restless",T("restless")]].map(([k,l])=>`<button class="signal-chip ${modal.choice===k?"active":""}" data-sos="${k}">${l}</button>`).join("")}</div><button class="primary" id="saveSos" style="margin-top:12px">${state.language==="de"?"Speichern & schließen":"Save & close"}</button></section></div>`}else if(modal.type==="summary"){r.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="sheet"><div class="grab"></div><header class="sheet-head"><h2>${T("summary")}</h2><button class="close" id="closeModal">×</button></header><pre class="copy-block">${esc(modal.text)}</pre><div class="sheet-actions"><button class="secondary" id="printSummary">${T("print")}</button><button class="primary" id="copySummary">${T("copy")}</button></div></section></div>`}else if(modal.type==="delete"){r.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="sheet"><div class="grab"></div><h2>${T("deleteTitle")}</h2><p class="small">${T("deleteText")}</p><div class="sheet-actions"><button class="secondary" id="cancelDelete">${T("cancel")}</button><button class="danger" id="confirmDelete">${T("deleteConfirm")}</button></div></section></div>`}bindModal()}
function bindModal(){document.getElementById("closeModal")?.addEventListener("click",closeModal);document.getElementById("backdrop")?.addEventListener("click",e=>{if(e.target.id==="backdrop")closeModal()});if(modal?.type==="checkin"){document.querySelectorAll("[data-energy]").forEach(b=>b.onclick=()=>{modal.draft.energy=Number(b.dataset.energy);renderModal()});document.querySelectorAll("[data-sleep]").forEach(b=>b.onclick=()=>{modal.draft.sleep=Number(b.dataset.sleep);renderModal()});document.querySelectorAll("[data-signal]").forEach(b=>b.onclick=()=>{const k=b.dataset.signal;modal.draft[k]=!modal.draft[k];renderModal()});document.querySelectorAll("[data-cycle]").forEach(b=>b.onclick=()=>{modal.draft.cycle=b.dataset.cycle;renderModal()});document.getElementById("saveCheckin")?.addEventListener("click",saveCheckin)}if(modal?.type==="sos"){document.querySelectorAll("[data-sos]").forEach(b=>b.onclick=()=>{modal.choice=b.dataset.sos;renderModal()});document.getElementById("saveSos")?.addEventListener("click",saveSos)}document.getElementById("printSummary")?.addEventListener("click",()=>window.print());document.getElementById("copySummary")?.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(modal.text)}catch{}showToast(T("copied"))});document.getElementById("cancelDelete")?.addEventListener("click",closeModal);document.getElementById("confirmDelete")?.addEventListener("click",()=>{localStorage.removeItem(KEY);state=structuredClone(DEFAULT);persist();modal=null;render();showToast(T("deleted"))})}
function saveCheckin(){const d=norm(modal.draft),e=todayEntry();if(e){d.id=e.id;d.date=e.date;state.entries=state.entries.map(x=>x.id===e.id?d:x)}else state.entries.push(d);persist();modal=null;render();showToast(T("saved"))}
function saveSos(){if(!modal.choice){closeModal();return}let e=todayEntry();if(!e){e=norm({energy:3,sleep:2,cycle:"none"});state.entries.push(e)}e[modal.choice]=true;e.acute=[...(e.acute||[]),{type:modal.choice,ts:new Date().toISOString()}];state.entries=state.entries.map(x=>x.id===e.id?e:x);persist();modal=null;render();showToast(T("saved"))}
function closeModal(){modal=null;renderModal()}
function showToast(m){clearTimeout(toastTimer);document.getElementById("toast")?.remove();const el=document.createElement("div");el.id="toast";el.className="toast";el.textContent=m;document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),2200)}
function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportJson(){download(`midlife-os-${localDay(new Date())}.json`,JSON.stringify({app:"Midlife OS",version:VER,state},null,2),"application/json")}
function exportCsv(){const rows=[["date","energy","sleep","heat","heart","brain_fog","restlessness","cycle","balance_score"],...state.entries.map(e=>[e.date,e.energy,e.sleep,e.heat,e.heart,e.fog,e.restless,e.cycle,score(e)])];download(`midlife-os-${localDay(new Date())}.csv`,rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8")}
function importJson(ev){const f=ev.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const p=JSON.parse(rd.result),i=p.state||p;if(!Array.isArray(i.entries))throw 0;state={...DEFAULT,...i,version:VER,entries:i.entries.map(norm)};persist();render();showToast(T("importOk"))}catch{showToast(T("importError"))}};rd.readAsText(f)}
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(["today","trends","doctor","settings"].includes(r)){state.route=r;persist();render()}});if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));applyTheme();if(!location.hash)location.hash=state.route;render();
})();
</script>
</body>
