function header(){return `<header class="header"><div class="brand"><span class="mark"></span><div><strong>${T("app")}</strong><small>${T("sub")}</small></div></div><div class="header-actions"><div class="lang"><button data-lang="de" class="${state.language==="de"?"active":""}">DE</button><button data-lang="en" class="${state.language==="en"?"active":""}">EN</button></div><button class="icon-btn" id="themeToggle">${ico("moon")}</button></div></header>`}function tabs(){return `<nav class="tabbar"><div class="tabs">${[["today",T("today"),"sun"],["trends",T("trends"),"trends"],["doctor",T("doctor"),"doctor"],["settings",T("data"),"data"]].map(([r,l,i])=>`<button class="tab ${state.route===r?"active":""}" data-route="${r}">${ico(i)}<span>${l}</span></button>`).join("")}</div></nav>`}
function ring(s){const r=58,c=2*Math.PI*r,o=c*(1-(s??0)/100);return `<div class="score-ring"><svg viewBox="0 0 140 140"><circle class="track" cx="70" cy="70" r="${r}"/><circle class="progress" cx="70" cy="70" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg><div class="score-copy"><strong>${s==null?"–":s+"%"}</strong><small>${T("balance")}</small></div></div>`}function bodyStatus(s){return s==null?T("todayEmpty"):s>=80?T("stable"):s>=60?T("moderate"):T("recover")}function dailyInsight(){const e=within(7);if(e.length<4)return T("insightDefault");return correlations(e)[0]?.text||T("insightDefault")}
function todayView(){const e=todayEntry(),s=score(e),recent=within(7),st=streak();return `<section class="hero"><article class="card hero-main"><div><span class="eyebrow">${T("today")}</span><h1>${bodyStatus(s)}</h1><p>${e?dailyInsight():T("todaySub")}</p></div><div>${e?`<div class="pills"><span class="pill">⚡ <b>${T("energy")} ${e.energy}/5</b></span><span class="pill">🌙 <b>${T("sleep")} ${e.sleep}/5</b></span><span class="pill">🧠 <b>${T("fog")} ${e.brainFog}/3</b></span></div>`:""}<button class="primary" id="openCheckin" style="margin-top:16px">${e?T("edit"):T("start")}</button></div></article><article class="card score-card">${ring(s)}</article></section><section class="grid"><div class="metrics"><div class="metric"><small>${T("streak")}</small><strong>${st} ${st===1?T("day"):T("days")}</strong></div><div class="metric"><small>${T("captured")}</small><strong>${state.entries.length}</strong></div><div class="metric"><small>${T("avg7")}</small><strong>${recent.length?avgScore(recent)+"%":"–"}</strong></div></div><article class="card"><div class="card-title"><strong>${T("insight")}</strong><small>${T("seven")}</small></div><div class="insight"><div class="insight-icon">✦</div><p>${dailyInsight()}</p></div></article><p class="small">${T("medical")}</p></section>`}
function makeDraft(){const e=todayEntry();return e?{...e}:{id:"",date:new Date().toISOString(),sleep:3,sleepIssue:"none",energy:3,brainFog:0,hot:0,pain:0,mood:3,cycle:"none",hrt:false,stress:3,notes:""}}function scale(field,count,current,start=1){return `<div class="scale">${Array.from({length:count},(_,i)=>i+start).map(v=>`<button data-field="${field}" data-value="${v}" class="${Number(current)===v?"active":""}">${v}</button>`).join("")}</div>`}function seg(field,opts,current){return `<div class="segmented">${opts.map(([v,l])=>`<button data-field="${field}" data-value="${v}" class="${String(current)===String(v)?"active":""}">${l}</button>`).join("")}</div>`}function stepContent(){if(step===1)return `<article class="check-card"><div class="question"><div class="question-label"><strong>${T("sleep")}</strong><small>${draft.sleep}/5</small></div>${scale("sleep",5,draft.sleep)}</div><div class="question"><div class="question-label"><strong>${T("sleepIssue")}</strong></div>${seg("sleepIssue",[["none",T("sleepNone")],["onset",T("onset")],["maintenance",T("maintenance")],["both",T("both")]],draft.sleepIssue)}</div><div class="question"><div class="question-label"><strong>${T("energy")}</strong><small>${draft.energy}/5</small></div>${scale("energy",5,draft.energy)}</div><div class="question"><div class="question-label"><strong>${T("fog")}</strong></div>${seg("brainFog",[[0,T("clear")],[1,T("mild")],[2,T("notice")],[3,T("strong")]],draft.brainFog)}</div></article>`;if(step===2)return `<article class="check-card"><div class="question"><div class="question-label"><strong>${T("hot")}</strong><small>${draft.hot}/4</small></div>${scale("hot",5,draft.hot,0)}</div><div class="question"><div class="question-label"><strong>${T("pain")}</strong><small>${draft.pain}/4</small></div>${scale("pain",5,draft.pain,0)}</div><div class="question"><div class="question-label"><strong>${T("mood")}</strong></div>${seg("mood",[[1,T("low")],[2,T("irritable")],[3,T("stableMood")],[4,T("powerful")]],d function pearson(x,y){if(x.length!==y.length||x.length<4)return NaN;const mx=x.reduce((a,b)=>a+b,0)/x.length,my=y.reduce((a,b)=>a+b,0)/y.length;let num=0,sx=0,sy=0;for(let i=0;i<x.length;i++){const dx=x[i]-mx,dy=y[i]-my;num+=dx*dy;sx+=dx*dx;sy+=dy*dy}const den=Math.sqrt(sx*sy);return den?num/den:NaN}function correlations(es){const defs=[{x:es.map(e=>6-e.sleep),y:es.map(e=>e.brainFog),k:"corrSleepFog"},{x:es.map(e=>e.stress),y:es.map(e=>e.hot),k:"corrStressHot"},{x:es.map(e=>e.sleep),y:es.map(e=>e.energy),k:"corrSleepEnergy"},{x:es.map(e=>e.pain),y:es.map(e=>6-e.energy),k:"corrPainEnergy"},{x:es.map(e=>e.stress),y:es.map(e=>5-e.mood),k:"corrStressMood"}];return defs.map(d=>({r:pearson(d.x,d.y),text:T(d.k)})).filter(i=>Number.isFinite(i.r)&&i.r>=.3).sort((a,b)=>b.r-a.r).slice(0,3)}function corrLabel(r){return r>=.65?T("clearPattern"):r>=.45?T("signal"):T("trend")}

function cycleLabel(v){return T({none:"none",spotting:"spot",light:"light",normal:"normal",heavy:"heavy",postmenopause:"post",irregular:"irregular"}[v]||"none")}function doctorStats(es){if(!es.length)return{freq:T("noSymptoms"),peaks:"–",cycle:"–",hrt:"–"};const c={hot:0,pain:0,fog:0,sleep:0},pk={hot:0,pain:0,fog:0},cycles={},hrt=es.filter(e=>e.hrt).length;es.forEach(e=>{if(e.hot>=2)c.hot++;if(e.pain>=2)c.pain++;if(e.brainFog>=2)c.fog++;if(e.sleep<=2)c.sleep++;if(e.hot>=3)pk.hot++;if(e.pain>=3)pk.pain++;if(e.brainFog>=3)pk.fog++;cycles[e.cycle]=(cycles[e.cycle]||0)+1});const labels={hot:T("hot"),pain:T("pain"),fog:T("fog"),sleep:T("sleep")},freq=Object.entries(c).filter(([,n])=>n).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>`${labels[k]} (${n}/${es.length})`).join(" · ")||T("noSymptoms"),peaks=[["hot",pk.hot],["pain",pk.pain],["fog",pk.fog]].filter(([,n])=>n).map(([k,n])=>`${labels[k]}: ${n}×`).join(" · ")||"–",cycle=Object.entries(cycles).sort((a,b)=>b[1]-a[1]).map(([v,n])=>`${cycleLabel(v)} (${n})`).join(" · ")||"–";return{freq,peaks,cycle,hrt:`${hrt}/${es.length}`}}

function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function render(){applyTheme();const isCheck=state.route==="checkin",view=state.route==="today"?todayView():state.route==="trends"?trendsView():state.route==="doctor"?doctorView():state.route==="settings"?settingsView():checkinView();root.innerHTML=`<div class="app">${isCheck?"":header()}<main>${view}</main></div>${isCheck?"":tabs()}<div id="modal"></div>`;bind();renderModal()}function navigate(r){state.route=r;persist();location.hash=r;render();scrollTo(0,0)}
function bind(){document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{state.language=b.dataset.lang;persist();render()});document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>navigate(b.dataset.route));document.getElementById("themeToggle")?.addEventListener("click",()=>{state.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";persist();render()});if(state.route==="today")document.getElementById("openCheckin").onclick=()=>{draft=makeDraft();step=1;state.route="checkin";render()};if(state.route==="checkin")bindCheck();if(state.route==="trends")document.querySelectorAll("[data-trend]").forEach(b=>b.onclick=()=>{state.trendRange=Number(b.dataset.trend);persist();render()});if(state.route==="doctor"){document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{state.doctorRange=Number(b.dataset.doc);persist();render()});document.getElementById("doctorQuestions")?.addEventListener("input",e=>{state.doctorQuestions=e.target.value;persist()});document.getElementById("openSummary").onclick=()=>{modal={type:"summary",text:summaryText()};renderModal()};document.getElementById("print").onclick=()=>print()}if(state.route==="settings")bindSettings()}
function bindCheck(){document.getElementById("closeCheck").onclick=()=>{draft=null;step=1;state.route="today";persist();render()};document.querySelectorAll("[data-field]").forEach(b=>b.onclick=()=>{const f=b.dataset.field,raw=b.dataset.value;draft[f]=["sleep","energy","brainFog","hot","pain","mood","stress"].includes(f)?Number(raw):raw;navigator.vibrate?.(8);render()});document.getElementById("hrt")?.addEventListener("click",()=>{draft.hrt=!draft.hrt;navigator.vibrate?.(10);render()});document.getElementById("notes")?.addEventListener("input",e=>draft.notes=e.target.value);document.getElementById("next")?.addEventListener("click",()=>{if(step<3){step++;render()}});document.getElementById("prev")?.addEventListener("click",()=>{if(step>1){step--;render()}});document.getElementById("save")?.addEventListener("click",saveCheck)}function saveCheck(){const old=todayEntry(),entry=normalize({...draft,id:old?.id||draft.id||uid(),date:old?.date||new Date().toISOString()});state.entries=old?state.entries.map(e=>e.id===old.id?entry:e):[...state.entries,entry];draft=null;step=1;state.route="today";persist();location.hash="today";render();navigator.vibrate?.([15,30,15]);toast(T("saved"))}
function bindSettings(){document.getElementById("themeSelect").onchange=e=>{state.theme=e.target.value;persist();render()};document.getElementById("exportJson").onclick=exportJson;document.getElementById("exportCsv").onclick=exportCsv;document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=importJson;document.getElementById("deleteAll").onclick=()=>{modal={type:"delete"};renderModal()}}function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportJson(){download(`midlife-os-backup-${day(new Date())}.json`,JSON.stringify({app:"Midlife OS",version:VER,exportedAt:new Date().toISOString(),state},null,2),"application/json")}function exportCsv(){if(!state.entries.length)return toast(T("noData"));const rows=[["date","sleep_quality","sleep_issue","energy","brain_fog","hot_flushes_night_sweats","joint_muscle_pain","mood_resilience","stress","cycle_status","hrt_mht","notes","balance_score"],...sorted().map(e=>[e.date,e.sleep,e.sleepIssue,e.energy,e.brainFog,e.hot,e.pain,e.mood,e.stress,e.cycle,e.hrt?"yes":"no",e.notes,score(e)])];download(`midlife-os-${day(new Date())}.csv`,rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8")}function importJson(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result),inc=p.state||p;if(!inc||!Array.isArray(inc.entries))throw Error();state={...DEFAULT,...inc,version:VER,entries:inc.entries.map(normalize).filter(Boolean)};persist();toast(T("importOk"));render()}catch(e){toast(T("importError"))}ev.target.value=""};r.readAsText(f)}
function renderModal(){const m=document.getElementById("modal");if(!m)return;if(!modal){m.innerHTML="";return}if(modal.type==="summary")m.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="sheet"><div class="grab"></div><header class="sheet-head"><div><span class="eyebrow">${T("doctor")}</span><h2>${T("summaryTitle")}</h2></div><button class="close" id="closeModal">×</button></header><pre class="copy-block">${esc(modal.text)}</pre><div class="sheet-actions"><button class="secondary" id="printModal">${T("print")}</button><button class="primary" id="copyModal">${T("copy")}</button></div></section></div>`;else m.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="sheet"><div class="grab"></div><header class="sheet-head"><div><span class="eyebrow">${T("deleteAll")}</span><h2>${T("deleteTitle")}</h2><p class="small">${T("deleteText")}</p></div></header><div class="sheet-actions"><button class="secondary" id="cancelDelete">${T("cancel")}</button><button class="danger" id="confirmDelete">${T("deleteConfirm")}</button></div></section></div>`;document.getElementById("backdrop")?.addEventListener("click",e=>{if(e.target.id==="backdrop"){modal=null;renderModal()}});document.getElementById("closeModal")?.addEventListener("click",()=>{modal=null;renderModal()});document.getElementById("cancelDelete")?.addEventListener("click",()=>{modal=null;renderModal()});document.getElementById("printModal")?.addEventListener("click",()=>print());document.getElementById("copyModal")?.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(modal.text)}catch(e){}toast(T("copied"))});document.getElementById("confirmDelete")?.addEventListener("click",()=>{localStorage.removeItem(KEY);state=structuredClone(DEFAULT);persist();modal=null;render();toast(T("deleted"))})}function toast(msg){clearTimeout(toastTimer);document.getElementById("toast")?.remove();const d=document.createElement("div");d.id="toast";d.className="toast";d.textContent=msg;document.body.appendChild(d);toastTimer=setTimeout(()=>d.remove(),2200)}
addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(["today","trends","doctor","settings"].includes(r)){state.route=r;persist();render()}});matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(state.theme==="system")render()});if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));const initial=location.hash.slice(1);if(["today","trends","doctor","settings"].includes(initial))state.route=initial;else if(state.route==="checkin")state.route="today";if(!location.hash)location.hash=state.route;applyTheme();render();})();
