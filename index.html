function normalize(e){if(!e||typeof e!=="object")return null;const d=new Date(e.date||e.ts||Date.now());const sig=e.signals||{};return{id:String(e.id||crypto.randomUUID?.()||Date.now()),date:isNaN(d)?new Date().toISOString():d.toISOString(),energy:Math.max(1,Math.min(5,Number(e.energy||3))),sleep:Math.max(1,Math.min(4,Number(e.sleep||3))),signals:{heat:Boolean(sig.heat??(e.hot>0)),heart:Boolean(sig.heart??e.palpitations),fog:Boolean(sig.fog??(e.brainFog>0)),restless:Boolean(sig.restless??(e.stress>3))},cycle:["none","spot","light","heavy"].includes(e.cycle)?e.cycle:"none",acute:e.acute||null};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&typeof x==="object")return{...DEFAULT,...x,version:VER,entries:Array.isArray(x.entries)?x.entries.map(normalize).filter(Boolean):[]}}catch{}return structuredClone(DEFAULT)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function day(v){const d=new Date(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function todayEntry(){const k=day(new Date());return state.entries.filter(e=>day(e.date)===k&&!e.acute).sort((a,b)=>new Date(b.date)-new Date(a.date))[0]||null}function days(n){const c=new Date();c.setHours(0,0,0,0);c.setDate(c.getDate()-n+1);return state.entries.filter(e=>!e.acute&&new Date(e.date)>=c).sort((a,b)=>new Date(a.date)-new Date(b.date))}function score(e){if(!e)return null;const signalCount=Object.values(e.signals).filter(Boolean).length;return Math.round(Math.max(28,Math.min(100,e.energy*11+e.sleep*10+35-signalCount*7)))}function status(s){return s==null?T("statusEmpty"):s>=78?T("balanced"):s>=58?T("sensitive"):T("recover")}function focusText(s){return s==null?T("focusEmpty"):s>=78?T("focusGood"):s>=58?T("focusMid"):T("focusLow")}
function theme(){const dark=state.theme==="dark"||(state.theme==="system"&&matchMedia("(prefers-color-scheme:dark)").matches);document.documentElement.dataset.theme=dark?"dark":"light";document.documentElement.lang=state.language;document.querySelector('meta[name="theme-color"]').content=dark?"#17191D":"#F6F3EE"}
const icons={today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg>',patterns:'<svg viewBox="0 0 24 24"><path d="M3 17c3-1 4-6 7-6s3 3 5 3 3-5 6-7"/></svg>',toolkit:'<svg viewBox="0 0 24 24"><path d="M12 21c-4-3-7-6-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4-3 7-7 10Z"/></svg>',doctor:'<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2M9 10h6M9 14h6M9 18h4"/></svg>',moon:'<svg viewBox="0 0 24 24"><path d="M20 15.3A8.4 8.4 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3z"/></svg>'};
function header(){return `<header class="header"><div class="brand"><span class="mark"></span><strong>LUNA</strong></div><div class="header-actions"><div class="lang"><button data-lang="de" class="${state.language==="de"?"active":""}">DE</button><button data-lang="en" class="${state.language==="en"?"active":""}">EN</button></div><button class="icon-btn" id="theme">${icons.moon}</button></div></header>`}
function nav(){return `<nav class="tabbar"><div class="tabs">${[["today","today"],["patterns","patterns"],["toolkit","toolkit"],["doctor","doctor"]].map(([r,k])=>`<button class="tab ${state.route===r?"active":""}" data-route="${r}">${icons[k]}<span>${T(k)}</span></button>`).join("")}</div></nav>`}
function heroRing(e){const s=score(e),r=72,c=2*Math.PI*r,off=c*(1-(s||0)/100);return `<div class="hero-ring ${e?"done":"open"}"><svg viewBox="0 0 170 170" aria-hidden="true"><defs><linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5B8E7D"/><stop offset="58%" stop-color="#2B2A4A"/><stop offset="100%" stop-color="#F2C57C"/></linearGradient></defs><circle class="hero-base" cx="85" cy="85" r="${r}"/><circle class="hero-progress" cx="85" cy="85" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="hero-center"><strong>${s==null?"–":s+"%"}</strong><span>${T("balance")}</span><b>${status(s)}</b></div></div>`}
function todayView(){const e=todayEntry(),s=score(e);return `<section class="today"><div></div><div class="today-main"><div class="today-title"><span class="eyebrow">${T("today")}</span><h1>${e?status(s):T("todayEmpty")}</h1></div>${heroRing(e)}<div class="today-actions"><button class="primary" id="checkin">${e?T("edit"):T("check")}</button><button class="sos" id="sos">${T("sos")}</button></div><div class="focus-card"><small>${T("focus")}</small><p>${focusText(s)}</p></div></div></section>`}
function avg(es,f){return es.length?(es.reduce((a,e)=>a+f(e),0)/es.length).toFixed(1):"–"}function pearson(a,b){if(a.length<4)return NaN;const ax=a.reduce((x,y)=>x+y,0)/a.length,bx=b.reduce((x,y)=>x+y,0)/b.length;let n=0,da=0,db=0;for(let i=0;i<a.length;i++){const x=a[i]-ax,y=b[i]-bx;n+=x*y;da+=x*x;db+=y*y}return da&&db?n/Math.sqrt(da*db):NaN}function correlations(es){if(es.length<4)return[];const vals=[{r:pearson(es.map(e=>5-e.sleep),es.map(e=>e.signals.fog?1:0)),t:T("corrSleepFog")},{r:pearson(es.map(e=>6-e.energy),es.map(e=>e.signals.restless?1:0)),t:T("corrEnergyRestless")},{r:pearson(es.map(e=>5-e.sleep),es.map(e=>e.signals.heat?1:0)),t:T("corrHeatSleep")}];return vals.filter(x=>Number.isFinite(x.r)&&x.r>.25).sort((a,b)=>b.r-a.r)}function chart(es){if(es.length<2)return `<div class="empty">${T("notEnough")}</div>`;const w=700,h=190,p=24,pts=es.map((e,i)=>({x:p+i*((w-2*p)/Math.max(1,es.length-1)),y:p+(100-score(e))*((h-2*p)/72)})),line=pts.map((q,i)=>`${i?"L":"M"} ${q.x} ${q.y}`).join(" "),area=`${line} L ${pts.at(-1).x} ${h-p} L ${pts[0].x} ${h-p} Z`;return `<svg class="chart" viewBox="0 0 ${w} ${h}"><path class="chart-grid" d="M${p} ${p}H${w-p}M${p} ${h/2}H${w-p}M${p} ${h-p}H${w-p}"/><path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>${pts.map(q=>`<circle class="chart-dot" cx="${q.x}" cy="${q.y}" r="4"/>`).join("")}</svg>`}
function patternsView(){const es=days(state.trendRange),cs=correlations(es);return `<section class="page-head"><span class="eyebrow">${T("patterns")}</span><h1>${T("trendTitle")}</h1><p>${T("trendSub")}</p></section><div class="filters"><button class="filter ${state.trendRange===7?"active":""}" data-range="7">${T("seven")}</button><button class="filter ${state.trendRange===30?"active":""}" data-range="30">${T("thirty")}</button></div><section class="grid"><div class="metrics"><div class="metric"><small>${T("avgBalance")}</small><strong>${es.length?Math.round(avg(es,score))+"%":"–"}</strong></div><div class="metric"><small>${T("avgSleep")}</small><strong>${avg(es,e=>e.sleep)}</strong></div><div class="metric"><small>${T("avgEnergy")}</small><strong>${avg(es,e=>e.energy)}</strong></div></div><article class="card">${chart(es)}</article><article class="card"><div class="page-head" style="margin:0 0 10px"><span class="eyebrow">${T("corr")}</span></div>${es.length<4?`<div class="empty">${T("notEnough")}</div>`:cs.length?cs.map(c=>`<div class="insight"><div class="insight-icon">↗</div><p>${c.t}</p></div>`).join(""):`<div class="insight"><div class="insight-icon">✦</div><p>${T("noCorr")}</p></div>`}</article></section>`}
function toolkitView(){return `<section class="page-head"><span class="eyebrow">${T("toolkit")}</span><h1>${T("toolTitle")}</h1><p>${T("toolSub")}</p></section><div class="tool-grid"><button class="tool-card" data-tool="46"><span class="tool-icon">🌬</span><div><strong>${T("b46")}</strong><small>${T("b46sub")}</small></div></button><button class="tool-card" data-tool="444"><span class="tool-icon">🧠</span><div><strong>${T("b444")}</strong><small>${T("b444sub")}</small></div></button><button class="tool-card" data-tool="night"><span class="tool-icon">🌙</span><div><strong>${T("night")}</strong><small>${T("nightsub")}</small></div></button><button class="tool-card" data-tool="cool"><span class="tool-icon">🧊</span><div><strong>${T("cool")}</strong><small>${T("coolsub")}</small></div></button></div>`}
function doctorStats(es){const c={heat:0,heart:0,fog:0,restless:0};es.forEach(e=>Object.keys(c).forEach(k=>{if(e.signals[k])c[k]++}));const names={heat:T("heat"),heart:T("heart"),fog:T("fog"),restless:T("restless")};return Object.entries(c).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]).slice(0,3).map(([k,v])=>`${names[k]} (${v}×)`).join(" · ")||"–"}function summaryText(){const es=days(state.doctorRange);return state.language==="de"?`LUNA – ARZT-ZUSAMMENFASSUNG\n\nZeitraum: letzte ${state.doctorRange} Tage\nErfasste Tage: ${es.length}\nØ Tages-Balance: ${es.length?Math.round(avg(es,score))+"%":"–"}\nHäufigste Signale: ${doctorStats(es)}\n\nFragen / Themen:\n${state.doctorQuestions||"–"}\n\n${T("medical")}`:`LUNA – APPOINTMENT SUMMARY\n\nPeriod: last ${state.doctorRange} days\nTracked days: ${es.length}\nAverage balance: ${es.length?Math.round(avg(es,score))+"%":"–"}\nMost frequent signals: ${doctorStats(es)}\n\nQuestions / topics:\n${state.doctorQuestions||"–"}\n\n${T("medical")}`}
function doctorView(){const es=days(state.doctorRange);return `<section class="page-head"><span class="eyebrow">${T("doctor")}</span><h1>${T("doctorTitle")}</h1><p>${T("doctorSub")}</p></section><div class="filters"><button class="filter ${state.doctorRange===30?"active":""}" data-doc-range="30">${T("last30")}</button><button class="filter ${state.doctorRange===90?"active":""}" data-doc-range="90">${T("last90")}</button></div><section class="grid"><article class="card"><div class="summary-row"><span>${T("tracked")}</span><strong>${es.length}</strong></div><div class="summary-row"><span>${T("avgBalance")}</span><strong>${es.length?Math.round(avg(es,score))+"%":"–"}</strong></div><div class="summary-row"><span>${T("frequent")}</span><strong>${doctorStats(es)}</strong></div><div class="summary-row"><span>${T("peak")}</span><strong>${doctorStats(es)}</strong></div></article><article class="card"><textarea id="doctorQuestions" placeholder="${T("questionsPh")}">${state.doctorQuestions||""}</textarea></article><button class="primary" id="summary">${T("summary")}</button><button class="secondary" id="print">${T("print")}</button><p class="small">${T("medical")}</p><button class="data-link" id="data">${T("data")}</button></section>`}
function escape(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function render(){theme();const view=state.route==="today"?todayView():state.route==="patterns"?patternsView():state.route==="toolkit"?toolkitView():doctorView();document.getElementById("root").innerHTML=`<div class="app">${header()}<main>${view}</main></div>${nav()}<div id="modalRoot"></div>`;bind();renderModal()}
function bind(){document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{state.language=b.dataset.lang;save();render()});document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{state.route=b.dataset.route;location.hash=state.route;save();render()});document.getElementById("theme").onclick=()=>{state.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";save();render()};if(state.route==="today"){document.getElementById("checkin").onclick=openCheckin;document.getElementById("sos").onclick=openSos}if(state.route==="patterns")document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{state.trendRange=+b.dataset.range;save();render()});if(state.route==="toolkit")document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>openTool(b.dataset.tool));if(state.route==="doctor"){document.querySelectorAll("[data-doc-range]").forEach(b=>b.onclick=()=>{state.doctorRange=+b.dataset.docRange;save();render()});document.getElementById("doctorQuestions").oninput=e=>{state.doctorQuestions=e.target.value;save()};document.getElementById("summary").onclick=()=>{modal={type:"summary",text:summaryText()};renderModal()};document.getElementById("print").onclick=()=>print();document.getElementById("data").onclick=()=>{modal={type:"data"};renderModal()}}}
function openCheckin(){const e=todayEntry();draft=e?structuredClone(e):{id:"",date:new Date().toISOString(),energy:3,sleep:3,signals:{heat:false,heart:false,fog:false,restless:false},cycle:"none"};modal={type:"checkin"};renderModal()}function openSos(){modal={type:"sos",symptom:null};renderModal()}function openTool(tool){modal={type:"tool",tool};renderModal()}
function checkinHtml(){const sleepOpts=[[1,T("sleepRestless")],[2,T("sleepMixed")],[3,T("sleepGood")],[4,T("sleepDeep")]],cycleOpts=[["none",T("cycleNone")],["spot",T("cycleSpot")],["light",T("cycleLight")],["heavy",T("cycleHeavy")]];return `<div class="compact-check"><div class="check-row"><label>${T("energy")}</label><div class="chips5">${[1,2,3,4,5].map(v=>`<button class="chip ${draft.energy===v?"active":""}" data-field="energy" data-value="${v}">${v}</button>`).join("")}</div></div><div class="check-row"><label>${T("sleep")}</label><div class="chips4">${sleepOpts.map(([v,l])=>`<button class="chip ${draft.sleep===v?"active":""}" data-field="sleep" data-value="${v}">${l}</button>`).join("")}</div></div><div class="check-row"><label>${T("signals")}</label><div class="signal-grid">${[["heat",T("heat")],["heart",T("heart")],["fog",T("fog")],["restless",T("restless")]].map(([k,l])=>`<button class="signal-chip ${draft.signals[k]?"active":""}" data-signal="${k}">${l}</button>`).join("")}</div></div><div class="check-row"><label>${T("cycle")}</label><div class="chips4">${cycleOpts.map(([v,l])=>`<button class="chip ${draft.cycle===v?"active":""}" data-field="cycle" data-value="${v}">${l}</button>`).join("")}</div></div><button class="primary" id="saveCheck">${T("finish")}</button></div>`}
function toolHtml(){if(modal.tool==="46"||modal.tool==="444")return `<div class="breath-wrap"><div class="breath-circle" id="breathCircle"><div><strong id="breathPhase">${T("inhale")}</strong><span id="breathCount">${modal.tool==="46"?"4 · 6":"4 · 4 · 4"}</span></div></div><button class="primary" id="breathStart">${T("startBreath")}</button></div>`;const arr=modal.tool==="night"?[T("night1"),T("night2"),T("night3")]:[T("cool1"),T("cool2"),T("cool3")];return `<div class="steps3">${arr.map((x,i)=>`<div class="step-card"><b>${i+1}</b><p>${x}</p></div>`).join("")}</div>`}
function renderModal(){const r=document.getElementById("modalRoot");if(!r)return;if(!modal){r.innerHTML="";stopBreath();return}let title="",body="";if(modal.type==="checkin"){title=T("check");body=checkinHtml()}if(modal.type==="sos"){title=T("sosTitle");body=`<p class="small">${T("sosSub")}</p><div class="signal-grid">${[["heat",T("heat")],["heart",T("heart")],["fog",T("fog")],["restless",T("restless")]].map(([k,l])=>`<button class="signal-chip ${modal.symptom===k?"active":""}" data-acute="${k}">${l}</button>`).join("")}</div><button class="primary" id="saveSos" style="margin-top:10px">${T("sosSave")}</button>`}if(modal.type==="tool"){title=modal.tool==="46"?T("b46"):modal.tool==="444"?T("b444"):modal.tool==="night"?T("night"):T("cool");body=toolHtml()}if(modal.type==="summary"){title=T("summary");body=`<pre class="copy-block">${escape(modal.text)}</pre><div class="sheet-actions"><button class="secondary" id="copy">${T("copy")}</button><button class="primary" id="printModal">${T("print")}</button></div>`}if(modal.type==="data"){title=T("data");body=`<div class="grid"><button class="secondary" id="json">${T("json")}</button><button class="secondary" id="importBtn">${T("import")}</button><button class="secondary" id="csv">${T("csv")}</button><button class="danger" id="reset">${T("reset")}</button><input class="file" id="importFile" type="file" accept="application/json,.json"></div>`}r.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="sheet"><div class="grab"></div><header class="sheet-head"><h2>${title}</h2><button class="close" id="closeModal">×</button></header>${body}</section></div>`;bindModal()}
function bindModal(){document.getElementById("closeModal").onclick=closeModal;document.getElementById("backdrop").onclick=e=>{if(e.target.id==="backdrop")closeModal()};if(modal.type==="checkin"){document.querySelectorAll("[data-field]").forEach(b=>b.onclick=()=>{const f=b.dataset.field,v=f==="cycle"?b.dataset.value:+b.dataset.value;draft[f]=v;renderModal()});document.querySelectorAll("[data-signal]").forEach(b=>b.onclick=()=>{draft.signals[b.dataset.signal]=!draft.signals[b.dataset.signal];renderModal()});document.getElementById("saveCheck").onclick=saveCheck}if(modal.type==="sos"){document.querySelectorAll("[data-acute]").forEach(b=>b.onclick=()=>{modal.symptom=b.dataset.acute;renderModal()});document.getElementById("saveSos").onclick=saveSos}if(modal.type==="tool"&&(modal.tool==="46"||modal.tool==="444"))document.getElementById("breathStart").onclick=()=>startBreath(modal.tool);if(modal.type==="summary"){document.getElementById("copy").onclick=async()=>{await navigator.clipboard?.writeText(modal.text);toast(T("copied"))};document.getElementById("printModal").onclick=()=>print()}if(modal.type==="data"){document.getElementById("json").onclick=exportJson;document.getElementById("csv").onclick=exportCsv;document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=importJson;document.getElementById("reset").onclick=()=>{if(confirm(T("resetAsk"))){localStorage.removeItem(KEY);state=structuredClone(DEFAULT);save();closeModal();toast(T("resetDone"));render()}}}}
function saveCheck(){const old=todayEntry(),e=normalize({...draft,id:old?.id||draft.id||crypto.randomUUID?.()||Date.now(),date:old?.date||new Date().toISOString()});state.entries=old?state.entries.map(x=>x.id===old.id?e:x):[...state.entries,e];save();closeModal();render();toast(T("saved"))}function saveSos(){if(!modal.symptom)return;state.entries.push(normalize({id:crypto.randomUUID?.()||Date.now(),date:new Date().toISOString(),acute:modal.symptom,energy:3,sleep:3,signals:{[modal.symptom]:true},cycle:"none"}));save();closeModal();toast(T("acuteSaved"))}
function startBreath(mode){stopBreath();breathMode=mode;const phases=mode==="46"?[["inhale",4],["exhale",6]]:[["inhale",4],["hold",4],["exhale",4]];let i=0,remaining=phases[0][1];const tick=()=>{const [phase,len]=phases[i];const c=document.getElementById("breathCircle"),p=document.getElementById("breathPhase"),n=document.getElementById("breathCount");if(!c||!p||!n)return; c.className=`breath-circle ${phase}`;p.textContent=T(phase);n.textContent=remaining;remaining--;if(remaining<1){i=(i+1)%phases.length;remaining=phases[i][1]}};tick();breathTimer=setInterval(tick,1000);document.getElementById("breathStart").textContent=T("stopBreath");document.getElementById("breathStart").onclick=stopBreath}function stopBreath(){if(breathTimer){clearInterval(breathTimer);breathTimer=null}const b=document.getElementById("breathStart");if(b)b.textContent=T("startBreath")}
function closeModal(){stopBreath();modal=null;renderModal()}function blob(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function exportJson(){blob(`luna-backup-${day(new Date())}.json`,JSON.stringify({app:"LUNA",version:VER,state},null,2),"application/json")}function exportCsv(){const rows=[["date","energy","sleep","heat","heart","brain_fog","restless","cycle","score"],...state.entries.filter(e=>!e.acute).map(e=>[e.date,e.energy,e.sleep,+e.signals.heat,+e.signals.heart,+e.signals.fog,+e.signals.restless,e.cycle,score(e)])];blob(`luna-${day(new Date())}.csv`,rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),"text/csv")}function importJson(ev){const f=ev.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const p=JSON.parse(rd.result),x=p.state||p;if(!Array.isArray(x.entries))throw 0;state={...DEFAULT,...x,version:VER,entries:x.entries.map(normalize).filter(Boolean)};save();closeModal();render();toast(T("importOk"))}catch{toast(T("importErr"))}};rd.readAsText(f)}function toast(t){document.getElementById("toast")?.remove();const d=document.createElement("div");d.id="toast";d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(["today","patterns","toolkit","doctor"].includes(r)){state.route=r;save();render()}});if(!["today","patterns","toolkit","doctor"].includes(state.route))state.route="today";if(!location.hash)location.hash=state.route;theme();render();if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script>
